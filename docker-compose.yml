# ============================================================
# Stack complète : Airflow + MinIO + Spark
# ============================================================
# Lancement :
#   docker compose up airflow-init   (1ère fois)
#   docker compose up -d
#
# Accès :
#   - Airflow UI    : http://localhost:8085  (admin/admin)
#   - MinIO Console : http://localhost:9001  (minioadmin/minioadmin123)
#   - Spark Master  : http://localhost:8081
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-amazon==9.0.0
      apache-airflow-providers-snowflake==5.7.1
      apache-airflow-providers-apache-spark==4.11.0
      requests==2.32.3
      boto3==1.35.36
      pandas>=2.1.2,<2.2.0
      pyarrow==17.0.0
      snowflake-connector-python==3.12.3
      python-dotenv==1.0.1
      dbt-core==1.8.7
      dbt-snowflake==1.8.3
      loguru==0.7.2
    # Variables custom du projet, exposées aux DAGs
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    MINIO_BUCKET: ${MINIO_BUCKET:-nyc-taxi-lake}
    NYC_APP_TOKEN: ${NYC_APP_TOKEN:-}
    NYC_DATASET_ID: ${NYC_DATASET_ID:-t29m-gskq}
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-NYC_TAXI}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./ingestion:/opt/airflow/ingestion
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./sf_loader:/opt/airflow/sf_loader
    - ./dbt_project:/opt/airflow/dbt_project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # ----------------------------------------------------------
  # Postgres : metastore Airflow
  # ----------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  # ----------------------------------------------------------
  # MinIO : Data Lake S3-compatible
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: nyc_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
    restart: always

  # Initialisation du bucket au démarrage
  minio-init:
    image: minio/mc:latest
    container_name: nyc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb -p localminio/${MINIO_BUCKET:-nyc-taxi-lake} || true;
      mc anonymous set public localminio/${MINIO_BUCKET:-nyc-taxi-lake} || true;
      echo 'Bucket prêt';
      exit 0;
      "

  # ----------------------------------------------------------
  # Spark : 1 master + 1 worker
  # ----------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: nyc_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8081:8080"   # Spark UI
      - "7077:7077"   # Spark master
    volumes:
      - ./spark_jobs:/opt/spark_jobs
    restart: always

  spark-worker:
    image: apache/spark:3.5.3
    container_name: nyc_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./spark_jobs:/opt/spark_jobs
    restart: always

  # ----------------------------------------------------------
  # Airflow : init, webserver, scheduler
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: webserver
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  minio-data:
